<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隐私政策 · 家庭资产与开销</title>
<style>body{font:15px/1.6 -apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;max-width:720px;margin:0 auto;padding:24px 16px;color:#1c1f1b;background:#f5f4ef}h1{font-size:22px}h2{font-size:16px;margin-top:22px}</style></head>
<body><h1>隐私政策</h1><p>最后更新：2026-10-16</p>
<h2>收集什么</h2><p>只收集你自己在应用里输入的内容：账户余额、收支记录、预算、目标、提醒，以及你主动上传的收据照片。不收集设备信息、位置、通讯录，不做广告追踪。</p>
<h2>存在哪里</h2><p>数据存放在运营方自己的服务器上，传输全程 HTTPS 加密。服务器每天自动备份，最多保留 30 天。</p>
<h2>第三方</h2><p>汇率来自 open.er-api.com，只请求汇率数字，不发送任何用户数据。没有其他第三方服务。</p>
<h2>谁能看到</h2><p>只有持有访问密钥的家庭成员。每次修改都会记录是谁改的。</p>
<h2>删除</h2><p>你可以在应用内随时导出全部数据（JSON），也可以联系运营方删除全部数据和收据。</p>
</body></html>
